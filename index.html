<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOGGLR — Server Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: {
                heading: ['"Space Grotesk"', 'sans-serif'],
                body: ['"DM Sans"', 'sans-serif'],
            }}}
        }
    </script>
    <style>
        :root {
            --bg:#070a1a;--surface:#0d1130;--surface-hover:#131845;
            --border:#1c2055;--border-subtle:#151a42;
            --text:#e8e8f0;--text-secondary:#8888aa;--text-muted:#4a4a6a;
            --online:#22c55e;--offline:#3a3a5c;--killing:#f59e0b;
            --danger:#ef4444;--accent:#c084fc;--gpu-color:#38bdf8;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 85% 10%,rgba(255,255,255,0.08),transparent),radial-gradient(ellipse 80% 70% at 15% 90%,rgba(0,0,0,0.5),transparent),linear-gradient(145deg,#0a1035 0%,#0d0a2e 35%,#1a0a3a 65%,#120830 100%);pointer-events:none;z-index:0}
        body::after{content:'';position:fixed;inset:0;opacity:0.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;pointer-events:none;z-index:0}
        .app-container{position:relative;z-index:1}
        #listContainer{background:rgba(13,17,48,0.55);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(28,32,85,0.6)}
        .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all .4s ease}
        .status-dot.online{background:var(--online);box-shadow:0 0 8px rgba(34,197,94,0.4);animation:po 2.5s ease-in-out infinite}
        .status-dot.offline{background:var(--offline)}
        .status-dot.killing{background:var(--killing);box-shadow:0 0 8px rgba(245,158,11,0.5);animation:pf .4s ease-in-out infinite}
        .status-dot.starting{background:var(--accent);box-shadow:0 0 8px rgba(192,132,252,0.5);animation:pf .6s ease-in-out infinite}
        @keyframes po{0%,100%{box-shadow:0 0 6px rgba(34,197,94,0.3)}50%{box-shadow:0 0 14px rgba(34,197,94,0.55)}}
        @keyframes pf{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
        .server-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid rgba(21,26,66,0.7);transition:background .2s ease,border-color .4s ease,opacity .4s ease;position:relative}
        .server-row:last-child{border-bottom:none}
        .server-row:hover{background:rgba(19,24,69,0.5)}
        .server-row.offline-row{opacity:.5}.server-row.offline-row:hover{opacity:.7}
        .server-row.killing-row{border-left:3px solid var(--killing);padding-left:17px}
        .server-row.killing-row .meta-value{opacity:.4}
        .server-row.starting-row{border-left:3px solid var(--accent);padding-left:17px}
        .inline-panel{border-radius:8px;padding:10px 14px;margin-top:8px;animation:pi .25s ease-out}
        @keyframes pi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        .error-panel{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15)}
        .ep-title{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--danger);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
        .ep-msg{font-family:'Space Grotesk',monospace;font-size:11px;color:#cc7777;line-height:1.5;margin-bottom:6px}
        .ep-solution{font-size:11px;color:var(--text-secondary);line-height:1.5;padding-top:6px;border-top:1px solid rgba(239,68,68,0.1)}
        .ep-solution strong{color:#99aaaa;font-weight:600}
        .lock-panel{background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.15)}
        .lp-title{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--killing);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
        .lp-file{font-family:'Space Grotesk',monospace;font-size:11px;color:#bbaa77;line-height:1.6;display:block;padding:2px 0}
        .lp-file i{color:var(--text-muted);width:14px;text-align:center;margin-right:4px;font-size:10px}
        .files-panel{background:rgba(192,132,252,0.04);border:1px solid rgba(192,132,252,0.12)}
        .fp-appdir{font-family:'Space Grotesk',monospace;font-size:11px;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:500}
        .fp-appdir i{font-size:10px;opacity:.7}
        .fp-file{font-family:'Space Grotesk',monospace;font-size:11px;color:var(--text-secondary);line-height:1.7;display:flex;align-items:center;gap:8px;padding:1px 0}
        .fp-file i{width:14px;text-align:center;font-size:10px;flex-shrink:0;color:var(--text-muted)}
        .fp-file .fp-path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .fp-file .fp-tag{font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;font-weight:600;flex-shrink:0}
        .fp-file .fp-open{font-size:9px;color:var(--text-muted);cursor:pointer;padding:2px 5px;border-radius:3px;flex-shrink:0;transition:all .15s;background:none;border:none;display:flex;align-items:center;gap:3px;font-family:'DM Sans',sans-serif}
        .fp-file .fp-open:hover{color:var(--accent);background:rgba(192,132,252,0.1)}
        .tag-config{background:rgba(96,165,250,0.1);color:#60a5fa}.tag-log{background:rgba(251,191,36,0.1);color:#fbbf24}
        .tag-data{background:rgba(34,197,94,0.1);color:#22c55e}.tag-source{background:rgba(192,132,252,0.1);color:#c084fc}
        .tag-binary{background:rgba(244,114,182,0.1);color:#f472b6}.tag-socket{background:rgba(245,158,11,0.1);color:#f59e0b}
        .tag-lock{background:rgba(239,68,68,0.1);color:#ef4444}.tag-env{background:rgba(45,212,191,0.1);color:#2dd4bf}
        .tag-cert{background:rgba(251,146,60,0.1);color:#fb923c}.tag-runtime{background:rgba(244,114,182,0.1);color:#f472b6}
        .view-files-btn{background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;padding:0;margin-top:3px;transition:color .15s}
        .view-files-btn:hover{color:var(--accent)}.view-files-btn i{font-size:9px;transition:transform .2s}.view-files-btn.open i{transform:rotate(90deg)}
        .dismiss-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:10px;padding:2px 6px;border-radius:4px;transition:color .15s;font-family:'DM Sans',sans-serif}.dismiss-btn:hover{color:var(--text-secondary)}
        .kill-btn{height:28px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);background:rgba(239,68,68,0.08);color:rgba(239,68,68,0.7);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-family:'Space Grotesk',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 10px;gap:5px;white-space:nowrap}
        .kill-btn:hover:not(:disabled){background:rgba(239,68,68,0.18);border-color:rgba(239,68,68,0.4);color:var(--danger)}
        .kill-btn:disabled{cursor:not-allowed;opacity:.3}
        .kill-btn.confirm-state{background:rgba(239,68,68,0.22);border-color:rgba(239,68,68,0.5);color:#ff6666;animation:bp .8s ease-in-out infinite}
        .kill-btn.spinner-state{color:var(--killing);border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.08);pointer-events:none}
        .kill-btn.locked-state{border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.08);color:var(--killing);pointer-events:none}
        @keyframes bp{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 10px 2px rgba(239,68,68,0.15)}}
        .start-btn{height:28px;border-radius:6px;border:1px solid rgba(34,197,94,0.2);background:rgba(34,197,94,0.08);color:rgba(34,197,94,0.7);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-family:'Space Grotesk',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 10px;gap:5px;white-space:nowrap}
        .start-btn:hover{background:rgba(34,197,94,0.18);border-color:rgba(34,197,94,0.4);color:var(--online)}
        .start-btn.spinner-state{color:var(--accent);border-color:rgba(192,132,252,0.3);background:rgba(192,132,252,0.08);pointer-events:none}
        .meta-value{font-family:'Space Grotesk',monospace;font-size:13px;font-weight:500;color:var(--text-secondary);line-height:1;transition:opacity .4s}
        .meta-value.port-link{color:var(--text);text-decoration:none;cursor:pointer;transition:color .15s}.meta-value.port-link:hover{color:var(--accent)}
        .filter-tab{padding:6px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-secondary);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
        .filter-tab:hover{color:var(--text);background:var(--surface-hover)}
        .filter-tab.active{background:rgba(13,17,48,0.6);border-color:var(--border);color:var(--text)}
        .filter-tab .count{display:inline-block;min-width:18px;text-align:center;padding:0 5px;border-radius:4px;background:rgba(255,255,255,0.05);font-size:11px;margin-left:6px;color:var(--text-muted);font-weight:600}
        .filter-tab.active .count{background:rgba(255,255,255,0.08);color:var(--text-secondary)}
        .search-input{background:rgba(13,17,48,0.6);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 34px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;width:200px;backdrop-filter:blur(8px)}
        .search-input::placeholder{color:var(--text-muted)}.search-input:focus{border-color:rgba(192,132,252,0.4);box-shadow:0 0 0 3px rgba(192,132,252,0.08)}
        .scan-progress{height:2px;background:linear-gradient(90deg,var(--accent),rgba(139,92,246,0.3));border-radius:2px;transition:width .15s linear;position:absolute;top:0;left:0;z-index:2}
        .server-row.reveal{animation:ri .35s ease-out both}
        @keyframes ri{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .toast-container{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{background:rgba(20,24,56,0.95);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,0.5);animation:ti .3s ease-out;pointer-events:auto;max-width:420px}
        .toast.leaving{animation:to .25s ease-in forwards}
        .toast .toast-icon{font-size:14px;flex-shrink:0}
        .toast.success .toast-icon{color:var(--online)}.toast.error .toast-icon{color:var(--danger)}.toast.info .toast-icon{color:var(--accent)}.toast.warning .toast-icon{color:var(--killing)}
        @keyframes ti{from{opacity:0;transform:translateX(30px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
        @keyframes to{to{opacity:0;transform:translateX(30px) scale(.95)}}
        .action-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:rgba(13,17,48,0.6);backdrop-filter:blur(8px);color:var(--text-secondary);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s}
        .action-btn:hover{background:var(--surface-hover);color:var(--text);border-color:#2a2a60}
        .action-btn.accent{border-color:rgba(192,132,252,0.25);color:var(--accent)}.action-btn.accent:hover{background:rgba(192,132,252,0.08);border-color:rgba(192,132,252,0.4)}
        .action-btn.danger-text{color:rgba(239,68,68,0.7);border-color:rgba(239,68,68,0.15)}.action-btn.danger-text:hover{color:var(--danger);background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.3)}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .gpu-widget{background:rgba(13,17,48,0.5);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(28,32,85,0.5);border-radius:14px;padding:18px 22px;min-width:260px;animation:gi .5s ease-out}
        @keyframes gi{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .gpu-pct{font-family:'Space Grotesk',monospace;font-size:42px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--gpu-color),#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .gpu-bar-track{width:100%;height:4px;background:rgba(56,189,248,0.1);border-radius:2px;overflow:hidden;margin-top:10px}
        .gpu-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gpu-color),#818cf8);transition:width .8s ease}
        .gpu-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:600}
        .gpu-name{font-family:'Space Grotesk',monospace;font-size:11px;color:var(--text-secondary);margin-top:2px}
        .gpu-note{font-size:9px;color:var(--text-muted);margin-top:8px;line-height:1.4;opacity:.6}
        .gpu-top-btn{background:none;border:1px solid rgba(56,189,248,0.2);color:var(--gpu-color);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;padding:4px 10px;border-radius:6px;margin-top:10px;transition:all .15s;display:flex;align-items:center;gap:5px}
        .gpu-top-btn:hover{background:rgba(56,189,248,0.08);border-color:rgba(56,189,248,0.35)}
        .gpu-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:rgba(13,17,48,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(28,32,85,0.6);border-radius:12px;padding:14px 18px;min-width:280px;box-shadow:0 16px 48px rgba(0,0,0,0.5);animation:ddi .2s ease-out;z-index:50}
        @keyframes ddi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        .gpu-dd-title{font-family:'Space Grotesk',monospace;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:10px}
        .gpu-dd-row{display:flex;align-items:center;gap:10px;padding:6px 0}
        .gpu-dd-rank{font-family:'Space Grotesk',monospace;font-size:10px;color:var(--text-muted);width:16px;text-align:center;font-weight:600}
        .gpu-dd-app{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--text-secondary);flex:1}
        .gpu-dd-pct{font-family:'Space Grotesk',monospace;font-size:12px;font-weight:600;color:var(--gpu-color);min-width:42px;text-align:right}
        .gpu-dd-bar{width:60px;height:3px;background:rgba(56,189,248,0.1);border-radius:2px;overflow:hidden;flex-shrink:0}
        .gpu-dd-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gpu-color),#818cf8)}
        .spec-chip{font-family:'Space Grotesk',monospace;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
        .spec-chip i{font-size:9px}.spec-chip .spec-val{color:var(--text-secondary);font-weight:500}
        .author-tag{font-family:'Space Grotesk',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.04em}
        .author-tag .author-name{color:var(--text-secondary);font-weight:600}
        @media(max-width:900px){.meta-pid,.meta-memory{display:none!important}.search-input{width:160px}.gpu-widget{min-width:220px;padding:14px 16px}.gpu-pct{font-size:32px}}
        @media(max-width:640px){.server-row{padding:12px 14px;gap:10px}.meta-uptime{display:none!important}.search-input{width:130px;font-size:12px}.filter-tab{padding:5px 10px;font-size:12px}.header-actions{gap:6px!important}.action-btn{padding:6px 10px;font-size:12px}.action-btn .btn-label{display:none}.kill-btn,.start-btn{font-size:9px;padding:0 7px}.fp-file .fp-open span{display:none}.gpu-widget{min-width:180px;padding:12px 14px}.gpu-pct{font-size:28px}.gpu-name{font-size:10px}.gpu-dropdown{min-width:240px;right:-20px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#333366}
    </style>
</head>
<body>
    <div class="app-container">
        <header class="px-6 md:px-10 pt-8 pb-4">
            <div class="max-w-5xl mx-auto flex items-start justify-between gap-4 flex-wrap">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <div class="w-8 h-8 rounded-lg border flex items-center justify-center" style="background:rgba(13,17,48,0.6);border-color:rgba(28,32,85,0.6);backdrop-filter:blur(8px)">
                            <i class="fa-solid fa-server text-xs text-[#8888aa]"></i>
                        </div>
                        <h1 class="font-heading text-2xl font-bold tracking-tight text-[#e8e8f0]">TOGGLR</h1>
                    </div>
                    <p class="font-body text-sm text-[#4a4a6a] ml-11">Server Manager</p>
                    <div class="flex items-center gap-5 mt-3 ml-11 flex-wrap" id="specChips"></div>
                    <p class="author-tag ml-11 mt-2">by <span class="author-name">Joseph Oracoy</span></p>
                </div>
                <div class="flex items-center gap-3" id="headerActions" class="header-actions">
                    <button id="rescanBtn" class="action-btn accent" onclick="rescan()" title="Rescan servers">
                        <i class="fa-solid fa-arrows-rotate" id="rescanIcon"></i>
                        <span class="btn-label">Rescan</span>
                    </button>
                    <button id="killAllBtn" class="action-btn danger-text" onclick="killAllOnline()" style="display:none" title="Force kill all online servers">
                        <i class="fa-solid fa-circle-xmark"></i>
                        <span class="btn-label">Kill All</span>
                    </button>
                </div>

                <div class="relative" id="gpuWidgetWrap">
                    <div class="gpu-widget" id="gpuWidget">
                        <div class="gpu-label">GPU Usage</div>
                        <div class="gpu-name" id="gpuName">Detecting...</div>
                        <div class="gpu-pct" id="gpuPct">—</div>
                        <div class="gpu-bar-track"><div class="gpu-bar-fill" id="gpuBar" style="width:0%"></div></div>
                        <div class="gpu-note" id="gpuNote"></div>
                        <button class="gpu-top-btn" onclick="toggleGpuDropdown()">
                            <i class="fa-solid fa-chart-bar" style="font-size:10px"></i> Top GPU Apps
                        </button>
                    </div>
                    <div class="gpu-dropdown hidden" id="gpuDropdown"></div>
                </div>
            </div>
        </header>

        <main class="px-6 md:px-10 pb-16">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center gap-6 mb-5 px-1">
                    <div class="flex items-center gap-2"><span class="status-dot online"></span><span class="font-body text-sm font-medium text-[#8888aa]" id="onlineCount">0 running</span></div>
                    <div class="flex items-center gap-2"><span class="status-dot offline"></span><span class="font-body text-sm font-medium text-[#4a4a6a]" id="offlineCount">0 stopped</span></div>
                </div>
                <div class="flex items-center justify-between gap-4 mb-4 flex-wrap">
                    <div class="flex items-center gap-2" id="filterTabs" role="tablist">
                        <button class="filter-tab active" data-filter="all" role="tab">All<span class="count" id="countAll">0</span></button>
                        <button class="filter-tab" data-filter="online" role="tab">Online<span class="count" id="countOnline">0</span></button>
                        <button class="filter-tab" data-filter="offline" role="tab">Offline<span class="count" id="countOffline">0</span></button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[#3a3a5c] text-xs"></i>
                        <input type="text" class="search-input" id="searchInput" placeholder="Filter servers..." aria-label="Search servers">
                    </div>
                </div>
                <div class="rounded-xl overflow-hidden relative" id="listContainer">
                    <div class="scan-progress" id="scanProgress" style="width:0%;display:none"></div>
                    <div id="serverList"></div>
                    <div class="empty-state hidden" id="emptyState">
                        <i class="fa-solid fa-ghost text-3xl mb-3 text-[#1c2055]"></i>
                        <p class="font-body text-sm">No servers match your filter</p>
                    </div>

                }
            } catch(err) {
                console.error('Render error:', err);
            }
        }

        function renderRow(s, index) {
            var isOnline=s.status==='online', isKilling=s.status==='killing', isOffline=s.status==='offline';
            var isStarting=s.status==='starting', isConfirming=killConfirmId===s.id, isLocked=!!lockedServers[s.id];
            var showFiles=!!openFilePanels[s.id]&&s.files&&s.files.length>0;

            var rc='server-row reveal';
            if(isOffline&&!isStarting)rc+=' offline-row';if(isKilling)rc+=' killing-row';if(isStarting)rc+=' starting-row';

            var dc='status-dot';
            if(isOnline)dc+=' online';else if(isKilling)dc+=' killing';else if(isStarting)dc+=' starting';else dc+=' offline';

            var ah='';
            if(isKilling)ah='<button class="kill-btn spinner-state" disabled><i class="fa-solid fa-spinner fa-spin"></i> KILLING</button>';
            else if(isLocked)ah='<button class="kill-btn locked-state" disabled><i class="fa-solid fa-lock"></i> LOCKED</button>';
            else if(isConfirming)ah='<button class="kill-btn confirm-state" data-id="'+s.id+'" data-action="kill-confirm"><i class="fa-solid fa-skull-crossbones"></i> CONFIRM</button>';
            else if(isOnline)ah='<button class="kill-btn" data-id="'+s.id+'" data-action="kill-idle"><i class="fa-solid fa-xmark"></i> FORCE KILL</button>';
            else if(isStarting)ah='<button class="start-btn spinner-state" disabled><i class="fa-solid fa-spinner fa-spin"></i> STARTING</button>';
            else ah='<button class="start-btn" data-id="'+s.id+'" data-action="start"><i class="fa-solid fa-play"></i> START</button>';

            var pl=isOnline?'<a class="meta-value port-link" href="http://localhost:'+s.port+'" target="_blank" rel="noopener">:'+s.port+'</a>':'<span class="meta-value">:'+s.port+'</span>';

            var vfb='';
            if(isOnline&&s.files&&s.files.length>0)vfb='<button class="view-files-btn'+(showFiles?' open':'')+'" data-id="'+s.id+'" data-action="toggle-files"><i class="fa-solid fa-chevron-right"></i> View files ('+s.files.length+')</button>';

            var fph='';
            if(showFiles){
                var adl=s.appDir?'<div class="fp-appdir"><i class="fa-solid fa-folder-open"></i>'+esc(s.appDir)+'</div>':'';
                var prefix=getCommonPrefix(s.files);
                var fl='';
                for(var fi=0;fi<s.files.length;fi++){
                    var f=s.files[fi], info=FILE_ICONS[f.type]||FILE_ICONS.config;
                    var dp=prefix&&f.path.indexOf(prefix)===0?f.path.substring(prefix.length):f.path;
                    fl+='<div class="fp-file" title="'+esc(f.path)+'"><i class="'+info.icon+'"></i><span class="fp-path">'+esc(dp)+'</span><span class="fp-tag tag-'+info.tag+'">'+info.tag+'</span><button class="fp-open" data-id="'+s.id+'" data-action="open-file" data-path="'+esc(f.path)+'" title="Open file location"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>Reveal</span></button></div>';
                }
                fph='<div class="inline-panel files-panel">'+adl+fl+'</div>';
            }

            var eh='';
            if(s.error)eh='<div class="inline-panel error-panel"><div class="ep-title"><i class="fa-solid fa-triangle-exclamation"></i> '+esc(s.error.title)+'</div><div class="ep-msg">'+esc(s.error.msg)+'</div><div class="ep-solution"><strong>Solution:</strong> '+s.error.solution+'</div><div style="text-align:right;margin-top:6px"><button class="dismiss-btn" data-id="'+s.id+'" data-action="dismiss-error">Dismiss</button></div></div>';

            var lh='';
            if(isLocked&&LOCK_SCENARIOS[s.id]){var lk=LOCK_SCENARIOS[s.id];var lf='';for(var li=0;li<lk.files.length;li++)lf+='<span class="lp-file"><i class="'+lk.files[li].type+'"></i>'+esc(lk.files[li].path)+'</span>';
                lh='<div class="inline-panel lock-panel"><div class="lp-title"><i class="fa-solid fa-lock"></i> '+esc(lk.title)+'</div><div>'+lf+'</div><div style="text-align:right;margin-top:6px"><button class="dismiss-btn" data-id="'+s.id+'" data-action="dismiss-lock">Dismiss</button></div></div>';}

            return '<div class="'+rc+'" style="animation-delay:'+index*30+'ms"><span class="'+dc+'"></span><div class="flex-1 min-w-0" style="display:flex;flex-wrap:wrap;align-items:center;gap:0"><div style="display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0"><i class="'+s.icon+' text-sm flex-shrink-0" style="color:'+s.iconColor+';opacity:'+(isOffline&&!isStarting?0.3:0.75)+';width:18px;text-align:center"></i><div class="min-w-0"><div class="font-heading text-[14px] font-semibold tracking-tight truncate">'+esc(s.name)+'</div><div class="font-body text-[12px] text-[#4a4a6a] truncate">'+esc(s.desc)+'</div>'+vfb+'</div></div>'+fph+eh+lh+'</div><div class="meta-port w-16 text-right flex-shrink-0 hidden sm:block">'+pl+'</div><div class="meta-pid w-16 text-right flex-shrink-0 hidden"><span class="meta-value">'+esc(s.pid||'—')+'</span></div><div class="meta-memory w-20 text-right flex-shrink-0 hidden"><span class="meta-value">'+esc(s.memory)+'</span></div><div class="meta-uptime w-16 text-right flex-shrink-0 hidden md:block"><span class="meta-value">'+esc(s.uptime)+'</span></div>'+ah+'</div>';
        }

        /* ===== ACTIONS ===== */
        function toggleFiles(id){openFilePanels[id]=!openFilePanels[id];render();}

        function showKillConfirm(id){if(killConfirmTimer)clearTimeout(killConfirmTimer);killConfirmId=id;render();killConfirmTimer=setTimeout(function(){killConfirmId=null;render();},4000);}

        function executeKill(id){
            if(killConfirmTimer)clearTimeout(killConfirmTimer);killConfirmId=null;
            var server=null;for(var i=0;i<servers.length;i++){if(servers[i].id===id){server=servers[i];break;}}
            if(!server||server.status!=='online')return;
            var savedPid=server.pid;delete openFilePanels[id];
            if(LOCK_SCENARIOS[id]){server.status='killing';render();setTimeout(function(){server.status='online';lockedServers[id]=true;render();showToast('Failed to force kill '+server.name+' (PID '+savedPid+') — process is locked','warning');},1200);return;}
            server.status='killing';render();setTimeout(function(){server.status='offline';server.pid=null;server.memory='—';server.uptime='—';server.error=null;delete lockedServers[id];render();showToast(server.name+' (PID '+savedPid+') force killed','success');},700);
        }

        window.killAllOnline = function(){
            var ol=[];for(var i=0;i<servers.length;i++){if(servers[i].status==='online'&&discoveredIds[servers[i].id])ol.push(servers[i]);}
            if(!ol.length)return;
            document.getElementById('rescanBtn').disabled=true;document.getElementById('killAllBtn').disabled=true;
            var idx=0,k=0;
            function doNext(){
                if(idx>=ol.length){if(k>0)showToast(k+' server'+(k>1?'s':'')+' terminated','info');document.getElementById('rescanBtn').disabled=false;document.getElementById('killAllBtn').disabled=false;return;}
                var server=ol[idx],savedPid=server.pid;delete openFilePanels[server.id];
                if(LOCK_SCENARIOS[server.id]){server.status='killing';render();setTimeout(function(){server.status='online';lockedServers[server.id]=true;render();showToast('Failed to force kill '+server.name+' — process is locked','warning');idx++;setTimeout(doNext,300);},1000);return;}
                server.status='killing';render();setTimeout(function(){server.status='offline';server.pid=null;server.memory='—';server.uptime='—';server.error=null;delete lockedServers[server.id];k++;render();showToast(server.name+' (PID '+savedPid+') force killed','success');idx++;setTimeout(doNext,200);},500);
            }
            doNext();
        };

        function executeStart(id){
            var s=null;for(var i=0;i<servers.length;i++){if(servers[i].id===id){s=servers[i];break;}}
            if(!s||s.status!=='offline')return;s.error=null;s.status='starting';render();
            setTimeout(function(){if(START_ERRORS[id]){s.status='offline';s.error=START_ERRORS[id];render();showToast('Failed to start '+s.name,'error');return;}
            s.status='online';s.pid=40000+Math.floor(Math.random()*15000);s.memory=(Math.random()*180+8).toFixed(1)+' MB';s.uptime=Math.floor(Math.random()*2)+'h '+String(Math.floor(Math.random()*15)).padStart(2,'0')+'m';s.error=null;render();showToast(s.name+' started on :'+s.port,'success');},1200);
        }

        function dismissError(id){for(var i=0;i<servers.length;i++){if(servers[i].id===id){servers[i].error=null;render();return;}}}
        function dismissLock(id){delete lockedServers[id];render();}

        /* ===== SCANNING — uses setTimeout chain, not promises ===== */
        function startScan(animate) {
            if (isScanning) return;
            isScanning = true;
            discoveredIds = {};

            var bar = document.getElementById('scanProgress');
            var icon = document.getElementById('rescanIcon');

            if (!animate) {
                for (var i=0;i<servers.length;i++) discoveredIds[servers[i].id]=true;
                render();
                isScanning = false;
                return;
            }

            bar.style.display='block'; bar.style.width='0%';
            icon.classList.add('fa-spin');
            render();

            var order = servers.slice().sort(function(){return Math.random()-0.5});
            var delay = Math.max(80, Math.floor(1800 / servers.length));
            var idx = 0;

            function next() {
                if (idx >= order.length) {
                    bar.style.display='none';
                    icon.classList.remove('fa-spin');
                    isScanning = false;
                    return;
                }
                discoveredIds[order[idx].id] = true;
                bar.style.width = ((idx+1)/servers.length*100)+'%';
                render();
                idx++;
                setTimeout(next, delay);
            }
            setTimeout(next, delay);
        }

        window.rescan = function(){
            if(isScanning)return;
            var t=[];for(var i=0;i<servers.length;i++){if(discoveredIds[servers[i].id]&&!lockedServers[servers[i].id])t.push(servers[i]);}
            if(t.length>2){var s1=t[Math.floor(Math.random()*t.length)];
                if(s1.status==='online'){s1.status='offline';s1.pid=null;s1.memory='—';s1.uptime='—';s1.error=null;delete openFilePanels[s1.id];}
                else if(s1.status==='offline'){s1.status='online';s1.pid=40000+Math.floor(Math.random()*10000);s1.memory=(Math.random()*200+5).toFixed(1)+' MB';s1.uptime=Math.floor(Math.random()*5)+'h '+Math.floor(Math.random()*60)+'m';s1.error=null;}}
            startScan(true);
        };

        /* ===== TOAST ===== */
        function showToast(message,type){
            type=type||'info';var c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast '+type;
            var icons={success:'fa-circle-check',error:'fa-circle-xmark',info:'fa-circle-info',warning:'fa-triangle-exclamation'};
            t.innerHTML='<i class="fa-solid '+(icons[type]||icons.info)+' toast-icon"></i><span class="font-body" style="white-space:pre-line">'+esc(message)+'</span>';
            c.appendChild(t);setTimeout(function(){t.classList.add('leaving');setTimeout(function(){t.remove();},250);},4500);
        }

        /* ===== EVENTS ===== */
        function initEvents(){
            document.getElementById('filterTabs').addEventListener('click',function(e){
                var tab=e.target.closest('.filter-tab');if(!tab)return;activeFilter=tab.dataset.filter;
                var tabs=document.querySelectorAll('.filter-tab');for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');tabs[i].setAttribute('aria-selected','false');}
                tab.classList.add('active');tab.setAttribute('aria-selected','true');render();
            });
            document.getElementById('searchInput').addEventListener('input',function(e){searchQuery=e.target.value;render();});
            document.addEventListener('click',function(e){if(killConfirmId!==null&&!e.target.closest('[data-action]')){killConfirmId=null;render();}});
            document.addEventListener('keydown',function(e){if(e.key==='Escape'&&killConfirmId!==null){killConfirmId=null;render();}});
        }

        /* ===== INIT ===== */
        document.addEventListener('DOMContentLoaded', function() {
            try {
                /* GPU */
                var realGpuName = detectGpu();
                document.getElementById('gpuName').textContent = realGpuName;
                document.getElementById('gpuNote').textContent = 'Real-time usage requires a native backend — showing estimated values';
                updateGpu();
                setInterval(updateGpu, 2500);

                /* Specs */
                renderSpecs();

                /* Events */
                initEvents();

                /* Scan servers */
                startScan(true);
            } catch(err) {
                console.error('Init error:', err);
                /* Fallback: show all servers immediately */
                for (var i=0;i<servers.length;i++) discoveredIds[servers[i].id]=true;
                render();
            }
        });

    })();
    </script>
</body>
</html>
